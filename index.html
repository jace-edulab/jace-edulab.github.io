<body>
<div id="setupBar" class="notice-bar" style="display:none"></div>
<header><div class="hwrap">
  <a class="home" href="#about" onclick="goHome(event)" aria-label="첫 화면으로"><div class="logo" id="logoBox"><span class="wm" role="img" aria-label="JACE"><i>J</i>ACE</span></div>
  <div class="brand"><h1>전북AI융합교육연구회</h1><p>교사가 직접 만드는 AI 수업 도구, 교실에서 함께 실천하는 연구</p></div></a>
  <div class="hright" id="hright"></div>
</div></header>
<nav><div class="nwrap">
  <a href="#about" data-v="about">JACE 소개</a>
  <a href="#public" data-v="public">자료실</a>

</div></nav>
<main id="main"><div class="loading">자료를 불러오는 중입니다…</div></main>
<footer><span class="flogo" id="footLogo"><span class="wm"><i>J</i>ACE</span></span>전북AI융합교육연구회 · 자료 이용 시 출처를 밝혀 주세요 · 학생 개인정보가 담긴 자료는 올리지 않습니다 <span class="ver" id="ver"></span><span class="pcnote">이 화면은 PC에 맞춰 만들었어요. 휴대폰에서는 일부가 좁게 보일 수 있어요.</span></footer>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy"><span id="busyTxt">처리 중…</span></div>
<script>
const APP_VERSION = "2.7.0";   // 판 번호: server/Code.gs 의 APP_VERSION 과 늘 같게
const DEMO = (() => { try { return new URLSearchParams(location.search).has("demo"); } catch (e) { return false; } })();   // ?demo : 지어낸 자료로 미리 눌러 보기

/* ===== 설정 (config.js) ===== */
const FIREBASE_CONFIG = window.JACE_FIREBASE || {};
const API_URL = window.JACE_API_URL || "__API_URL__";
const ADMINS = (window.JACE_ADMINS || []).map(e => String(e).toLowerCase());
const MANAGERS = (window.JACE_MANAGERS || []).map(e => String(e).toLowerCase());
const ROLES = ["회장", "부회장", "총무", "임원", "회원"];
const OFFICERS = ["회장", "부회장", "총무", "임원"];
const wmHTML = () => '<span class="wm"><i>J</i>ACE</span>';
const symSvg = size => `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JACE 로고"><rect width="100" height="100" rx="22" fill="#16307A"/><text x="50" y="62" font-family="Montserrat,Arial,sans-serif" font-weight="800" font-size="33" text-anchor="middle" fill="#ffffff">J<tspan fill="#FF8A3D">ACE</tspan></text></svg>`;

/* ===== 상태 ===== */
let CFG = { grades: [], areas: [], types: [], bookTitle: "" };
let PUB = [];          // 공개 목록(손님용)
let ME = null;         // 로그인한 사람 정보
let MD = null;         // 회원 데이터(회원만)
let AD = null;         // 운영진 데이터
let view = "about", asub = "intro", msub = "chat", calM = new Date();
let MINE = null, ALL = null;
let f = { q: "", g: [], a: [], ty: [], dl: [], sort: "new" };
let bookSel = new Set(), bookTitle = "", bookMine = false;
calM = new Date(calM.getFullYear(), calM.getMonth(), 1);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TODAY = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2800); }
function busy(on, txt) { $("#busyTxt").textContent = txt || "처리 중…"; $("#busy").classList.toggle("show", !!on); }
const isMember = () => !!(ME && ME.member);
const isAdmin = () => !!(ME && ME.admin);

/* ===== 파이어베이스 로그인 ===== */
firebase.initializeApp(FIREBASE_CONFIG);
const AUTH = firebase.auth();
/* 카카오톡 등 앱 안 브라우저: 구글이 로그인을 막으므로 바깥 브라우저로 */
const UA = navigator.userAgent || "";
const INAPP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|BAND\/|DaumApps|everytimeApp|; wv\)/i.test(UA);
const IS_IOS = /iPhone|iPad|iPod/i.test(UA), IS_KAKAO = /KAKAOTALK/i.test(UA);
function openOutside() {
  const url = location.href;
  if (IS_KAKAO) { location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url); return; }
  if (!IS_IOS) { location.href = "intent://" + url.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end"; return; }
  inappHelp(true);
}
function inappHelp(force) {
  if (document.querySelector(".inapp")) return;
  const d = document.createElement("div"); d.className = "inapp";
  d.innerHTML = `<div class="box"><h2>다른 브라우저로 열어 주세요</h2>
   <p>지금은 ${IS_KAKAO ? "카카오톡" : "앱"} 안의 브라우저로 열려 있어요. 구글이 이런 곳에서는 로그인을 막고 있어서, 사파리나 크롬에서 열어야 로그인할 수 있어요.</p>
   <div class="steps">${IS_IOS
     ? (IS_KAKAO ? "1. 오른쪽 아래 <b>⋯</b> 또는 공유 단추를 누릅니다.<br>2. <b>Safari로 열기</b>(다른 브라우저로 열기)를 누릅니다." : "1. 화면의 <b>⋯</b> 메뉴를 누릅니다.<br>2. <b>Safari로 열기</b> 또는 <b>브라우저로 열기</b>를 누릅니다.")
     : "1. 오른쪽 위 <b>⋮</b> 메뉴를 누릅니다.<br>2. <b>다른 브라우저로 열기</b>를 누르고 <b>Chrome</b>을 고릅니다."}</div>
   <div class="btns">${!IS_IOS || IS_KAKAO ? `<button class="btn primary" onclick="openOutside()">${IS_IOS ? "Safari로 열기" : "Chrome으로 열기"}</button>` : ""}
   <button class="btn" onclick="copyText(location.href,'주소를 복사했어요. 브라우저 주소창에 붙여 넣어 주세요')">주소 복사</button>
   <button class="btn" style="border:0;color:var(--sub)" onclick="this.closest('.inapp').remove()">로그인 없이 둘러보기</button></div></div>`;
  document.body.appendChild(d);
}
if (INAPP) {
  let tried = false; try { tried = sessionStorage.getItem("jace_out") === "1"; sessionStorage.setItem("jace_out", "1"); } catch (e) {}
  if (IS_KAKAO && !tried) openOutside();
}
async function login() {
  if (DEMO) return demoNo();
  if (INAPP) { inappHelp(); return; }
  try { await AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch (e) { if (e.code !== "auth/popup-closed-by-user") toast("로그인하지 못했어요: " + (e.message || e.code)); }
}
async function logout() { chatStop(); clearCache(); await AUTH.signOut(); ME = null; MD = null; AD = null; if (["mine", "admin"].includes(view)) go("about"); render(); }

/* ===== 서버 호출 ===== */
const apiReady = () => API_URL && !API_URL.startsWith("__");
async function api(action, data = {}) {
  if (!apiReady()) throw new Error("아직 서버 주소(API_URL)가 설정되지 않았습니다.");
  const token = AUTH.currentUser ? await AUTH.currentUser.getIdToken() : null;
  const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, token, ...data }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "서버 오류");
  return j;
}
/* 큰 응답(파일)을 받을 때 받은 양을 알려 주는 api */
async function apiStream(action, data, onBytes) {
  if (!apiReady()) throw new Error("아직 서버 주소(API_URL)가 설정되지 않았습니다.");
  const token = AUTH.currentUser ? await AUTH.currentUser.getIdToken() : null;
  const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, token, ...data }) });
  let j;
  if (res.body && res.body.getReader) {
    const rd = res.body.getReader(), parts = []; let n = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); n += value.length; onBytes && onBytes(n); }
    const all = new Uint8Array(n); let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
    j = JSON.parse(new TextDecoder().decode(all));
  } else j = await res.json();
  if (!j.ok) throw new Error(j.error || "서버 오류");
  return j;
}
const mb = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + "MB";
async function loadPublic(fresh) {
  if (DEMO) { CFG = DEMO_CFG; PUB = DEMO_ITEMS; bookTitle = DEMO_CFG.bookTitle; return; }
  let j = null;
  if (!fresh) { try { const r = await fetch("data/public.json?t=" + Date.now()); if (r.ok) j = await r.json(); } catch (e) {} }
  if ((!j || !j.ok) && apiReady()) { try { j = await (await fetch(API_URL + "?action=publicList")).json(); } catch (e) {} }
  if (j && j.ok) { CFG = j.config; PUB = j.items; if (!bookTitle) bookTitle = CFG.bookTitle || "연구회 수업 자료집"; }
}
async function loadMember() { if (isMember() && apiReady()) { MD = await api("memberData"); if (AUTH.currentUser) saveCache(AUTH.currentUser.uid); } }
async function loadAdmin() {
  if (!isAdmin()) return;
  const s = await firebase.database().ref("members").get(); ALL = s.val() || {};
  if (rtOK()) {
    try { USEDALL = (await firebase.database().ref("used").get()).val() || {}; } catch (e) { USEDALL = {}; }
    if (!REV.length) { try { const o = (await firebase.database().ref("reviews").get()).val() || {}; REVA = Object.keys(o).map(k => Object.assign({ id: k }, o[k])); } catch (e) {} }
    await loadIdeas();
  }
  if (apiReady()) { try { AD = await api("adminData"); } catch (e) { AD = { log: [], sheetUrl: "" }; } } else AD = { log: [], sheetUrl: "" };
}
async function reloadAll(fresh = true) { await loadPublic(fresh); if (isMember()) await loadMember(); if (isAdmin() && view === "admin") await loadAdmin(); render(); }

/* 이 기기에서 로그인 유지 + 새로 고침 때 바로 보이도록 마지막 상태를 기억 */
try { AUTH.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
let authReady = false;
const CK = uid => "jace_cache_" + uid;
function saveCache(uid) { try { localStorage.setItem(CK(uid), JSON.stringify({ ME, MD, at: Date.now() })); } catch (e) {} }
function readCache(uid) { try { const c = JSON.parse(localStorage.getItem(CK(uid)) || "null"); return c && Date.now() - c.at < 14 * 864e5 ? c : null; } catch (e) { return null; } }
function clearCache() { try { Object.keys(localStorage).filter(k => k.startsWith("jace_cache_")).forEach(k => localStorage.removeItem(k)); } catch (e) {} }

/* 회원 정보: 파이어베이스 members/{uid} */
const isMgrEmail = e => MANAGERS.includes(String(e || "").toLowerCase());
const roleOf = r => r && isMgrEmail(r.email) ? "회장" : (r && ROLES.includes(r.role) ? r.role : "회원");
async function loadMe(user) {
  const email = String(user.email || "").toLowerCase();
  if (ADMINS.includes(email)) { MINE = null; return { email, name: "JACE 운영진", school: "전북AI융합교육연구회", status: "승인", member: true, admin: true, rep: true, role: "운영진" }; }
  const s = await firebase.database().ref("members/" + user.uid).get(); MINE = s.val();
  const status = MINE ? MINE.status : "없음", role = roleOf(Object.assign({ email }, MINE || {}));
  return { email, name: MINE ? MINE.name : "", school: MINE ? MINE.school : "", status, member: status === "승인", admin: status === "승인" && OFFICERS.includes(role), role };
}
function syncPeople() {
  if (!AUTH.currentUser || !ME || !ME.member) return;
  const p = ME.rep ? { n: "JACE 운영진", sc: "전북AI융합교육연구회", rep: true, admin: true } : { n: ME.name || "", sc: ME.school || "", admin: !!ME.admin, book: !(MINE && MINE.book === false) };
  firebase.database().ref("people/" + AUTH.currentUser.uid).set(p).catch(() => {});
}
async function refreshMe() {
  if (!AUTH.currentUser) return;
  ME = await loadMe(AUTH.currentUser); syncPeople();
  if (isMember()) { try { await loadMember(); } catch (e) {} chatStart(); } else chatStop();
  saveCache(AUTH.currentUser.uid); render();
}
AUTH.onAuthStateChanged(async user => {
  if (DEMO) { authReady = true; ME = null; render(); return; }
  authReady = true;
  if (!user) { chatStop(); ME = null; MD = null; MINE = null; render(); return; }
  const c = readCache(user.uid);
  if (c && c.ME) { ME = c.ME; MD = c.MD; render(); }
  try {
    ME = await loadMe(user); syncPeople();
    if (ME.status === "없음") { render(); openJoin(); return; }
    if (isMember() && apiReady()) await loadMember();
    if (view === "admin") await loadAdmin();
    saveCache(user.uid);
  } catch (e) { if (!c) toast("회원 정보를 불러오지 못했어요: " + e.message); }
  render();
  if (isMember()) chatStart(); else chatStop();
});

/* ===== 공통 데이터 ===== */
const allItems = () => (MD ? MD.items : PUB);
const AREA_MAIN = () => CFG.areas.map(A => A.n);
const AREA_COLORS = ["#2F8A57", "#2B5797", "#C25E12", "#7A4FB5", "#0F7C86", "#9A3D5C"];
const areaStyle = n => { const i = AREA_MAIN().indexOf(n); return i < 0 ? "" : `style="--c:${AREA_COLORS[i % AREA_COLORS.length]}"`; };
const areaColor = n => { const i = AREA_MAIN().indexOf(n); return i < 0 ? "" : AREA_COLORS[i % AREA_COLORS.length]; };
const mainsOf = it => CFG.areas.filter(A => it.a.includes(A.n) || A.s.some(x => it.a.includes(x))).map(A => A.n);
function bandOf(it) {
  const cs = mainsOf(it).map(areaColor).filter(Boolean); if (!cs.length) return "";
  if (cs.length === 1) return cs[0];
  const w = 100 / cs.length; return `linear-gradient(90deg,${cs.map((c, i) => `${c} ${(i * w).toFixed(2)}% ${((i + 1) * w).toFixed(2)}%`).join(",")})`;
}
const mainArea = it => AREA_MAIN().find(n => it.a.includes(n)) || "기타";

/* ===== 머리 · 메뉴 ===== */
function header() {
  const h = $("#hright");
  if (!ME && !authReady) h.innerHTML = `<span class="who">로그인 확인 중…</span>`;
  else if (!ME) h.innerHTML = `<button class="btn ghost" onclick="openJoin()">가입 신청</button><button class="btn primary" onclick="login()">구글 계정으로 로그인</button>`;
  else {
    const pill = ME.rep ? '<span class="pill ok">운영진</span>' : ME.member ? `<span class="pill ok">${esc(ME.role || "회원")}</span>` : `<span class="status-pill">${ME.status === "대기" ? "승인 대기 중" : ME.status === "보류" ? "가입 보류" : "가입 전"}</span>`;
    const nm = ME.rep ? "JACE 대표 계정" : esc(ME.name || ME.email) + (ME.name ? " 선생님" : "");
    h.innerHTML = `<span class="who">${nm}${pill}</span>${ME.member ? `<button class="btn primary" onclick="openUpload()">자료 올리기</button>` : (ME.status === "없음" || ME.status === "보류" ? `<button class="btn primary" onclick="openJoin()">가입 신청</button>` : "")}<button class="btn ghost" onclick="logout()">로그아웃</button>`;
  }
  $("#lockTag").style.display = isMember() ? "none" : "";
  $("#navMine").style.display = isMember() ? "" : "none";
  $("#navAdmin").style.display = isAdmin() ? "" : "none";
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === view));
}
function goHome(e) { if (e) e.preventDefault(); closeM(); const bv = document.getElementById("bookView"); if (bv) bv.classList.remove("show"); go("about"); asub = "intro"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function go(v) { view = v; try { history.replaceState(null, "", "#" + v); } catch (e) {} }

/* ===== 목록 ===== */
function match(it) {
  if (f.q) { const q = f.q.toLowerCase(); if (!(it.t + it.d + it.by + it.a.join()).toLowerCase().includes(q)) return false; }
  if (f.g.length && !f.g.some(x => it.g.includes(x))) return false;
  if (f.a.length && !f.a.some(x => it.a.includes(x))) return false;
  if (f.ty.length && !f.ty.includes(it.ty)) return false;
  if (f.dl.length && !f.dl.includes(it.m ? "회원만 받기" : "누구나 받기")) return false;
  return true;
}
function tog(k, x) { const i = f[k].indexOf(x); i < 0 ? f[k].push(x) : f[k].splice(i, 1); render(); }
const ICONS = {
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'
};
const ic = (n, sz = 16) => `<svg class="ic" width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ""}</svg>`;
function chipRow(list, key) { return list.map(x => `<button class="chip ${f[key].includes(x) ? "on" : ""}" onclick='tog("${key}",${JSON.stringify(x)})'>${esc(x)}</button>`).join(""); }

function monthPick(src) {

  if (B.length) return { L: B, h: "지난달,<br>교실에서 태어난 도구", cap: `${+pm.slice(5)}월에 태어난 도구` };

function labelTables() {
  document.querySelectorAll("table.rt").forEach(t => {
    const rows = [...t.rows]; if (!rows.length) return;
    const heads = [...rows[0].cells].map(c => c.textContent.trim());
    rows[0].classList.add("rt-head");
    rows.slice(1).forEach(r => [...r.cells].forEach((c, i) => { if (heads[i]) c.dataset.label = heads[i]; else c.classList.add("rt-act"); }));
  });
}

function linksOf(it) {

    const i = l.indexOf(" | "); if (i < 0) return { label: "", url: l };

}

  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = px; c.getContext("2d").drawImage(img, 0, 0, px, px); res(c); }; img.onerror = rej; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(symSvg(px)); });

async function overlayPng(W, H, foot) {
  const s = 1.5, c = document.createElement("canvas"); c.width = Math.round(W * s); c.height = Math.round(H * s);
  const x = c.getContext("2d");
  try { const logo = await symPng(240); x.globalAlpha = 0.07; const L = Math.min(W, H) * 0.32 * s; x.drawImage(logo, (c.width - L) / 2, c.height / 2 - L * 1.05, L, L); } catch (e) {}
  x.globalAlpha = 0.09; x.fillStyle = "#17325C"; x.textAlign = "center"; x.textBaseline = "middle";

  x.save(); x.translate(c.width / 2, c.height / 2); x.rotate(-Math.atan2(H, W)); x.fillText("전북AI융합교육연구회", 0, 0); x.restore();

function linkInRow(l) {

function addLinkRow() { $("#ulinks").insertAdjacentHTML("beforeend", linkInRow()); const r = $("#ulinks").lastElementChild; r && r.querySelector(".ll").focus(); }
function readLinks() {
  const rows = [...document.querySelectorAll("#ulinks .lrow")].map(r => ({ label: r.querySelector(".ll").value.replace(/[|\r\n]/g, " ").trim(), url: r.querySelector(".lu").value.trim() })).filter(x => x.url || x.label);

async function sendUpload() {
  const t = $("#ut").value.trim(), d = $("#ud").value.trim(), err = $("#uerr");
  const g = [...document.querySelectorAll("#ug .chip.on")].map(b => b.dataset.g), a = [...document.querySelectorAll("#ua .chip.on")].map(b => b.dataset.a);
  const files = UPF.slice(), LR = readLinks(); if (LR.err) return err.textContent = LR.err; const link = LR.text;
  if (!t) return err.textContent = "자료 이름을 적어 주세요.";
  if (!g.length || !a.length) return err.textContent = "학교급과 교과를 하나 이상 골라 주세요.";
  const removeIdx = [...document.querySelectorAll(".urm input:checked")].map(x => +x.dataset.i);
  const keepN = EDIT ? filesOf(EDIT).length - removeIdx.length : 0;
  if (!files.length && !link && !keepN) return err.textContent = "파일을 고르거나 링크를 적어 주세요.";
  const big = files.find(f => f.size > 20 * 1024 * 1024);

  if (!$("#c1").checked || !$("#c2").checked) return err.textContent = "개인정보와 저작권 확인에 체크해 주세요.";

  try {
    const N = files.length, step = i => busy(true, N > 1 ? `파일 올리는 중… ${i} / ${N}` : "올리는 중… 파일이 크면 조금 걸려요");
    const fileBody = async f => ({ b64: await fileToB64(f), name: f.name, mime: f.type });
    const item = { t, d, g, a, ty: $("#uty").value, src: $("#usrc").value.trim(), why: $("#uwhy").value.trim().slice(0, 60), ver: $("#uver").value.trim().slice(0, 12), link, scope };
    let id, rest;

      step(0); busy(true, "고치는 중…");
      await api("updateItem", Object.assign({ id: EDIT.id, scope, edit: Object.assign(item, { removeIdx, addCount: N, thumbRemove: !!($("#uthrm") && $("#uthrm").checked) }) }, THUMB ? { thumb: THUMB } : {}));
      id = EDIT.id; rest = files;
    } else {
      step(1);
      const first = files.length ? await fileBody(files[0]) : {};
      id = (await api("upload", Object.assign({ item, more: Math.max(0, N - 1) }, first, THUMB ? { thumb: THUMB } : {}))).id;
      rest = files.slice(1);
    }
    for (let k = 0; k < rest.length; k++) {
      step(N - rest.length + k + 1);
      await api("addFile", Object.assign({ id, last: k === rest.length - 1 }, await fileBody(rest[k])));
    }
    UPF = [];
    if (EDIT) {
      const back = view;
      closeM(); await reloadAll(true); if (back !== view) { go(back); render(); }

  } catch (e) { err.textContent = e.message; } finally { busy(false); }
}

function shrinkImg(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      let q = 0.8, max = 1280, out = "";
      for (let k = 0; k < 6; k++) {
        const sc = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q); if (out.length <= 300000) break;
        q -= 0.1; max = Math.round(max * 0.85);
      }
      res(out); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function revPick(inp) {
  const fs = [...inp.files].filter(f => f.type.startsWith("image/")), box = $("#rvprev");

  for (let i = 0; i < fs.length; i++) {

    try { const u = await shrinkImg(fs[i]); REVPICS.push(u); box.insertAdjacentHTML("beforeend", `<img src="${u}" alt="">`); } catch (e) {}
  }
  box.dataset.msg = REVPICS.length ? `${REVPICS.length}장 준비됨` : "";
}

}
